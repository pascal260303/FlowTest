# Profile information which cannot be modified by the orchestration tool.
name: 1ppf_3MF_1024BPP
description: Custom created profiles with predictable traffic
marks: [1ppf, 81.92Mb/s, 5min, 3M-FLOWS, 1-ACTIVE, 1ppf, 10Kp/s]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/profiles/1ppf_3MF_1024BPP.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 10000
  mbps: 81.92
  start_phase_duration: 0
  end_phase_duration: 0
  generator:
    packet_size_probabilities:
      "64-1037": .0
      "1038-1038": 1 # für konstante paketgröße von 1024, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: 1ppf_3MF_1024BPP_statistical
    marks: []
    speed_multiplier: 1.0
    loops: 20
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1

sim_threshold:
  - id: 1ppf_3MF_1024BPP_throughput
    marks: [binary_search]
    mbps_accuracy: 50
    mbps_required: 2500
    analysis:
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1