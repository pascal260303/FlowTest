# Profile information which cannot be modified by the orchestration tool.
name: cpr_1Mpps_60s_1A
description: Custom created profiles with predictable traffic
marks: [cpr, 511.87Mb/s, 1min, 1M-FLOWS, 1-ACTIVE, 59ppf, 1Mp/s]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/profiles/cpr_1Mpps_60s_1A.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 1000000
  mbps: 511.866666666666688
  generator:
    packet_size_probabilities:
      "64-78": .0
      "79-79": 1 # für konstante paketgröße von 65, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cpr_1Mpps_60s_1A_statistical
    marks: []
    speed_multiplier: 1.0
    loops: 20
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
