# Profile information which cannot be modified by the orchestration tool.
name: cpr_10Kpps_60s_100KA
description: Custom created profiles with predictable traffic
marks: [cpr, 5.12Mb/s, 1min, 100K-FLOWS, 100K-ACTIVE, 5ppf, 10Kp/s]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/profiles/cpr_10Kpps_60s_100KA.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 10000
  mbps: 5.12
  generator:
    packet_size_probabilities:
      "64-77": .0
      "78-78": 1 # für konstante paketgröße von 64, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cpr_10Kpps_60s_100KA_statistical
    marks: []
    speed_multiplier: 1.0
    loops: 20
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
