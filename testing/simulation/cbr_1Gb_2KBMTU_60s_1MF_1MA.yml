# Profile information which cannot be modified by the orchestration tool.
name: cbr_1Gb_2KBMTU_60s_1MF_1MA
description: Custom created profiles with predictable traffic
marks: [cbr, 1Gb/s, 1min, 1M-FLOWS, 1K-ACTIVE, 4ppf, 80Kp/s]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/profiles/cbr_1Gb_2KBMTU_60s_1MF_1MA.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 80000
  mbps: 1000
  generator:
    packet_size_probabilities:
      "64-1575": .0
      "1576-1576": 1 # für konstante paketgröße von 1562, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cbr_1Gb_2KBMTU_60s_1MF_1MA_statistical
    marks: []
    speed_multiplier: 1.0
    loops: 20
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
