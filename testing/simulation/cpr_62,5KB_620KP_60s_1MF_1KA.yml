# Profile information which cannot be modified by the orchestration tool.
name: cpr_62,5KB_620KP_60s_1MF_1KA
description: Custom created profiles with predictable traffic
marks: [cpr, 10Gb/s, 1min, 1G-FLOWS, 1M-ACTIVE, 31ppf]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/profiles/cpr_62,5KB_620KP_60s_1MF_1KA.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 620000
  mbps: 10000
  generator:
    packet_size_probabilities:
      "64-2029": .0
      "2030-2030": 1 # für konstante paketgröße von 2016, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cpr_62,5KB_620KP_60s_1MF_1KA_statistical
    marks: []
    speed_multiplier: 1.0
    loops: 20
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
