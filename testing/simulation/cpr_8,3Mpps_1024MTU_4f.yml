# Profile information which cannot be modified by the orchestration tool.
name: cpr_8,3Mpps_1024MTU_4f
description: Custom created profiles with predictable traffic
marks: [cpr, 67.99Gb/s, 18s, 4-FLOWS, 4-ACTIVE, 16600000ppf, 8.3Mp/s]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/profiles/cpr_8,3Mpps_1024MTU_4f.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 8300000
  mbps: 67993.6
  start_phase_duration: 0
  end_phase_duration: 0
  apply_loop_offsets: false
  generator:
    packet_size_probabilities:
      "64-1037": .0
      "1038-1038": 1 # für konstante paketgröße von 1024, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cpr_8,3Mpps_1024MTU_4f_statistical
    marks: []
    speed_multiplier: 1.0
    loops: 30
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
