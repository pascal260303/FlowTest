# Profile information which cannot be modified by the orchestration tool.
name: cbr_10Gb_2KBMTU_60s_1MF_1KA
description: Custom created profiles with predictable traffic
marks: [cbr, 10Gb, 60s, 1MF, 1KA]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/cbr_10Gb_2KBMTU_60s_1MF_1KA.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 6120000
  mbps: 10000
  generator:
    packet_size_probabilities:
      "64-2055": .0
      "2056-2056": 1 # für konstante paketgröße von 2042, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cbr_10Gb_2KBMTU_60s_1MF_1KA_precise
    marks: [precise]
    speed_multiplier: 1.0
    loops: 1
    analysis:
      model: "precise"
      use_statistic_counter: true
  - id: cbr_100Gb_2KBMTU_60s_1MF_1KA_statistical
    marks: [100G]
    speed_multiplier: 12
    loops: 12
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
