# Profile information which cannot be modified by the orchestration tool.
name: cpr_8,3Mpps_512MTU_1f
description: Custom created profiles with predictable traffic
marks: [cpr, 34Gb/s, 18s, 1-FLOWS, 1-ACTIVE, 149400000ppf, 8.3Mp/s]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/profiles/cpr_8,3Mpps_512MTU_1f.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 8300000
  mbps: 33996.8
  start_phase_duration: 0
  end_phase_duration: 0
  generator:
    packet_size_probabilities:
      "64-525": .0
      "526-526": 1 # für konstante paketgröße von 512, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cpr_8,3Mpps_512MTU_1f_statistical
    marks: []
    speed_multiplier: 1.0
    loops: 30
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
