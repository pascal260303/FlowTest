# Profile information which cannot be modified by the orchestration tool.
name: Hospital 10G
description: 10G Traffic from a hospital
marks: [hospitals]
requirements:
  speed: 100
profile: https://liberouter.org/repo/flowtest/profiles/10G_Hospital/profile_trimmed_360s_10s.csv
mtu: 2048
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 103500
  mbps: 721
  generator: []
  probe:
    protocols: [as, dns, ipv4, http, eth, vlan, mpls, tls]
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: hospital_precise
    marks: [precise, with_all]
    speed_multiplier: 1.0
    loops: 3
    analysis:
      model: "precise"
      use_statistic_counter: true
  - id: hospital_100G
    marks: [100G]
    mbps: 120000
    loops: 140
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1

sim_threshold:
  - id: hospital_throughput
    marks: [with_all]
    mbps_accuracy: 50
    mbps_required: 2500
    analysis:
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
