# Profile information which cannot be modified by the orchestration tool.
name: cpr_1ppf_60s_10MF
description: Custom created profiles with predictable traffic
marks: [cpr, 85.33Mb/s, 1min, 10G-FLOWS, 1K-ACTIVE, 1ppf]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/profiles/cpr_1ppf_60s_10MF.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 166666
  mbps: 85.333333333333328
  generator:
    packet_size_probabilities:
      "64-77": .0
      "78-78": 1 # für konstante paketgröße von 64, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cpr_1ppf_60s_10MF_statistical
    marks: []
    speed_multiplier: 1.0
    loops: 20
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
