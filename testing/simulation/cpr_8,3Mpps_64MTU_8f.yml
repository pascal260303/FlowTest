# Profile information which cannot be modified by the orchestration tool.
name: cpr_8,3Mpps_64MTU_8f
description: Custom created profiles with predictable traffic
marks: [cpr, 4.25Gb/s, 18s, 8-FLOWS, 8-ACTIVE, 18675000ppf, 8.3Mp/s]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/profiles/cpr_8,3Mpps_64MTU_8f.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 8300000
  mbps: 4249.6
  start_phase_duration: 0
  end_phase_duration: 0
  apply_loop_offsets: false
  generator:
    packet_size_probabilities:
      "64-77": .0
      "78-78": 1 # für konstante paketgröße von 64, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cpr_8,3Mpps_64MTU_8f_statistical
    marks: []
    speed_multiplier: 1.0
    loops: 30
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 1
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
