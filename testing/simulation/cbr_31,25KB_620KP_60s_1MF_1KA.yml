# Profile information which cannot be modified by the orchestration tool.
name: cbr_31,25KB_620KP_60s_1MF_1KA
description: Custom created profiles with predictable traffic
marks: [cbr, cpr, 31.25KB, 60s, 1MF, 1KA]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/cbr_31,25KB_620KP_60s_1MF_1KA.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 620000
  mbps: 10000
  generator:
    packet_size_probabilities:
      "64-1021": .0
      "1022-1022": 1 # für konstante paketgröße von 1008, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cbr_31,25KB_620KP_60s_1MF_1KA_precise
    marks: [precise]
    speed_multiplier: 1.0
    loops: 20
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
