# Profile information which cannot be modified by the orchestration tool.
name: One Packet
description: One Packet per flow
marks: [small_mtu, one_packet]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/one_packet_flows_2.csv
mtu: 2048
sampling: 1

# default configuration describing the setup during profile collection
default:
  pps: 86291
  mbps: 790
  generator: []
    #ipv4:
    #  fragmentation_probability: 0.05%
    #ipv6:
    #  fragmentation_probability: 0%
  probe:
    protocols: [ as, eth, tcp, ipv4, ipv6, dns, http, tls, mail, mpls, vlan ]
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: one_packet_precise
    marks: [precise]
    speed_multiplier: 1.0
    analysis:
      model: "precise"
      use_statistic_counter: true

  - id: one_packet_statistical
    marks: []
    speed_multiplier: 1.0
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.5
        - key: BYTES
          diff: 0.5
        - key: FLOWS
          diff: 0.5
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
  - id: one_packet_speedup_400G
    marks: [speedup]
    mbps: 400000
    loops: 100
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.5
        - key: BYTES
          diff: 0.5
        - key: FLOWS
          diff: 0.5
        - key: PACKETS / S
          diff: 0.5
        - key: MB / S
          diff: 0.5
        - key: DURATION
          diff: 0.5

sim_threshold:
  - id: one_packet_throughput
    marks: []
    mbps_accuracy: 50
    mbps_required: 50000
    loops: 10
    analysis:
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 0.5
        - key: MB / S
          diff: 0.5
        - key: DURATION
          diff: 0.5