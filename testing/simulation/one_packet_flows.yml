# Profile information which cannot be modified by the orchestration tool.
name: One Packet
description: One Packet per flow
marks: [small_mtu, one_packet]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/one_packet_flows.csv
mtu: 2048
sampling: 1

# default configuration describing the setup during profile collection
default:
  pps: 81814
  mbps: 760
  generator: []
  probe:
    protocols: [ as, eth, tcp, ipv4, ipv6, dns, http, tls, mail, mpls, vlan ]
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: one_packet_precise
    speed_multiplier: 1.0
    loops: 1
    marks: [precise]
    analysis:
      model: "precise"
      use_statistic_counter: true

sim_threshold:
  - id: one_packet_throughput
    mbps_accuracy: 100
    mbps_required: 700
    speed_max: 12500
    analysis:
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
  - id: one_packet_small_cache_size
    marks: []
    mbps_accuracy: 100
    mbps_required: 500
    speed_max: 12500
    probe:
      cache_size: 14 # exponent to the power of 2
    analysis:
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
  - id: one_packet_larger_cache_size
    marks: []
    mbps_accuracy: 100
    mbps_required: 500
    speed_max: 12500
    probe:
      cache_size: 20 # exponent to the power of 2
    analysis:
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
    
  - id: one_packet_short_timeout
    marks: []
    mbps_accuracy: 100
    mbps_required: 900
    speed_max: 12500
    probe:
      active_timeout: 10
      inactive_timeout: 10
