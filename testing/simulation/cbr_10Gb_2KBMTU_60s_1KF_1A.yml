# Profile information which cannot be modified by the orchestration tool.
name: cbr_10Gb_2KBMTU_60s_1KF_1A
description: Custom created profiles with predictable traffic
marks: [cbr, 10Gb, 60s, 1KF, 1A]
requirements:
  speed: 100
profile: /home/student/2025-bsc-kuppler-flowmeter/cbr_10Gb_2KBMTU_60s_1KF_1A.csv
mtu: 4096
sampling: 1.0

# default configuration describing the setup during profile collection
default:
  pps: 610366
  mbps: 10000
  generator:
    packet_size_probabilities:
      "64-2060": .0
      "2061-2061": 1 # für konstante paketgröße von 2047, wird als MTU (+14) von create_network_profile.py berechnet
  probe:
    protocols: []
    active_timeout: 300
    inactive_timeout: 30

# individual tests for general simulation scenario
sim_general:
  - id: cbr_10Gb_2KBMTU_60s_1KF_1A_precise
    marks: [precise]
    speed_multiplier: 1.0
    loops: 20
    analysis:
      model: "statistical"
      use_statistic_counter: true
      metrics:
        - key: PACKETS
          diff: 0.001
        - key: BYTES
          diff: 0.001
        - key: FLOWS
          diff: 0.001
        - key: PACKETS / S
          diff: 1
        - key: MB / S
          diff: 1
        - key: DURATION
          diff: 1
